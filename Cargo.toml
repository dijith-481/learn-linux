[workspace]
resolver = "2"
members = [
    "crates/learn-core",
    "crates/learn-challenge",
    "crates/learn-protocol",
    "crates/learn-runtime",
    "crates/learn-docs",
    "crates/learn-daemon",
    "crates/learn-tui",
    "app/learn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1.0.100"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
frizbee = "0.13.0"
kdl = "6.7.1"
portable-pty = "0.9.0"
prost = "0.14.4"
ratatui = "0.30.2"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
redb = "2.6.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "process"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
